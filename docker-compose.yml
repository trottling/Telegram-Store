x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Одноразовый прогон миграций + бутстрап root-admin, затем выход.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: telegram-store-migrate
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-network
    <<: *default-logging

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: telegram-store-bot
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - public-network
      - backend-network
    <<: *default-logging

  admin_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin_backend
    container_name: telegram-store-admin-backend
    env_file:
      - path: .env
        required: true
    # порт наружу не пробрасываем — снаружи торчит только caddy, до admin_backend
    # он достаёт по имени сервиса внутри public-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - public-network
      - backend-network
    <<: *default-logging

  payments_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: payments_backend
    container_name: telegram-store-payments-backend
    env_file:
      - path: .env
        required: true
    # порт наружу не пробрасываем — вебхуки мерчантов идут через caddy (pay.$DOMAIN_NAME)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - public-network
      - backend-network
    <<: *default-logging

  admin_frontend:
    build:
      context: ./admin_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_PANEL_BACKEND_URL:-http://localhost:8080}
    container_name: telegram-store-admin-frontend
    # порт наружу не пробрасываем — статику отдаёт caddy (admin.$DOMAIN_NAME)
    restart: unless-stopped
    networks:
      - public-network
    depends_on:
      - admin_backend
    <<: *default-logging

  # TLS-терминатор: единственный сервис с портами наружу (80/443), автовыпуск
  # сертификатов Let's Encrypt по ACME HTTP-01/TLS-ALPN. Домены и почта — из
  # DOMAIN_NAME/ACME_EMAIL (см. .env, поддомены admin./api./pay. собираются
  # из DOMAIN_NAME прямо в Caddyfile).
  caddy:
    image: caddy:2-alpine
    container_name: telegram-store-caddy
    env_file:
      - path: .env
        required: true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin_backend
      - payments_backend
      - admin_frontend
    restart: unless-stopped
    networks:
      - public-network
    <<: *default-logging

  db:
    image: postgres:18-alpine
    container_name: telegram-store-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    <<: *default-logging

  redis:
    image: redis:8-alpine
    container_name: telegram-store-redis
    # ACL-пользователь из REDIS_USERNAME/REDIS_PASSWORD, default отключён —
    # подключиться можно только этой парой, requirepass одного пароля недостаточно
    # (config.New() отдельно проверяет, что обе переменные не пустые и не
    # плейсхолдер из .env.example).
    command: [
      "redis-server", "--appendonly", "yes",
      "--user", "default", "off",
      "--user", "${REDIS_USERNAME}", "on", ">${REDIS_PASSWORD}", "allcommands", "allkeys", "allchannels"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USERNAME}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    <<: *default-logging

  # Ежедневный pg_dump + опциональная выгрузка в S3 (rclone), см. backup/.
  # На public-network только ради исходящего трафика к S3-эндпоинту —
  # backend-network (internal: true) наружу не роутит.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: telegram-store-backup
    env_file:
      - path: .env
        required: true
    environment:
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
      - public-network
    <<: *default-logging

networks:
  # db+redis видны только bot/admin_backend/payments_backend/migrate/backup, без выхода наружу
  backend-network:
    driver: bridge
    internal: true
  # нужна для исходящих к Telegram (bot), к S3 (backup) и для caddy/admin_backend/
  # payments_backend/admin_frontend, между которыми ходят проксируемые запросы.
  # Подсеть закреплена, потому что admin_backend доверяет X-Forwarded-For только
  # от неё (ADMIN_PANEL_TRUSTED_PROXIES) — на плавающем адресе из дефолтного
  # пула Docker это доверие пришлось бы выдавать вслепую.
  public-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_data:
