x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# config.New() валидирует ADMIN_PANEL_FRONTEND_URL/CORS_ORIGIN у каждого
# Go-бинарника (migrate/bot/admin-backend/payments-backend) независимо от
# того, читает ли конкретно этот бинарник поле — а в проде оба всегда равны
# https://$DOMAIN_NAME (один хост на всё, см. Caddyfile). Чтобы не держать
# в .env три одинаковые строки, если переменная там не задана явно —
# подставляется https://${DOMAIN_NAME}; явное значение в .env, как и раньше,
# имеет приоритет.
#
# ${PUBLIC_PORT:+:${PUBLIC_PORT}} — порт дописывается, только если PUBLIC_PORT
# вообще задан: пустой (по умолчанию) даёт обычный https://domain без :443,
# что важно для CORS (браузер не шлёт :443 в Origin для порта по умолчанию —
# https://domain:443 никогда не совпал бы). Нужен, когда 443 на VPS занят
# чем-то посторонним (например, свой Xray/VPN) — тогда PUBLIC_PORT=8443 (или
# любой другой свободный порт) переносит сюда весь публичный трафик магазина,
# см. PUBLIC_PORT в .env.example.
x-admin-panel-urls: &admin-panel-urls
  ADMIN_PANEL_FRONTEND_URL: ${ADMIN_PANEL_FRONTEND_URL:-https://${DOMAIN_NAME}${PUBLIC_PORT:+:${PUBLIC_PORT}}}
  ADMIN_PANEL_CORS_ORIGIN: ${ADMIN_PANEL_CORS_ORIGIN:-https://${DOMAIN_NAME}${PUBLIC_PORT:+:${PUBLIC_PORT}}}

# Явные публичные DNS вместо того, что Docker унаследует из /etc/resolv.conf
# хоста. На части VPS (Ubuntu + systemd-resolved без ожидаемого симлинка)
# туда попадает "127.0.0.53" как есть — это стаб-резолвер хоста, слушающий
# только на самом хосте, а не внутри сетевого namespace контейнера, и любой
# внешний DNS-запрос (ACME у Let's Encrypt/ZeroSSL, Telegram API, платёжные
# провайдеры, S3) падает "connection refused". Резолв контейнерных имён
# (db/redis/...) эту переменную не использует — тот идёт через встроенный
# Docker DNS (127.0.0.11) независимо от неё.
x-public-dns: &public-dns
  dns:
    - 1.1.1.1
    - 8.8.8.8

services:
  # Одноразовый прогон миграций + бутстрап root-admin, затем выход.
  migrate:
    # image+build вместе: `docker compose pull && up -d` (без --build) просто
    # тянет готовый образ из GHCR (см. .github/workflows/build-images.yml) —
    # для слабого VPS сборка Go на месте не нужна. `docker compose build`
    # по-прежнему работает и соберёт локально под тем же тегом, если нужно.
    image: ${IMAGE_REGISTRY:-ghcr.io/trottling}/telegram-store-migrate:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: telegram-store-migrate
    env_file:
      - path: .env
        required: true
    environment:
      <<: *admin-panel-urls
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - backend-network
    <<: *default-logging

  bot:
    image: ${IMAGE_REGISTRY:-ghcr.io/trottling}/telegram-store-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: telegram-store-bot
    env_file:
      - path: .env
        required: true
    environment:
      <<: *admin-panel-urls
      # Домен и caddy уже есть — переключаем бота на вебхуки, если
      # BOT_WEBHOOK_URL не задан явно (см. config.BotWebhookConfig,
      # bot.TelegramBot.Start). docker-compose.debug.yml этот блок не
      # получает и остаётся на long polling — там нет ни домена, ни https.
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-https://${DOMAIN_NAME}${PUBLIC_PORT:+:${PUBLIC_PORT}}/bot}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - public-network
      - backend-network
    <<: [*default-logging, *public-dns]

  admin-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/trottling}/telegram-store-admin-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: admin_backend
    container_name: telegram-store-admin-backend
    env_file:
      - path: .env
        required: true
    environment:
      <<: *admin-panel-urls
    # порт наружу не пробрасываем — снаружи торчит только caddy, до admin-backend
    # он достаёт по имени сервиса внутри public-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - public-network
      - backend-network
    <<: *default-logging

  payments-backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/trottling}/telegram-store-payments-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: payments_backend
    container_name: telegram-store-payments-backend
    env_file:
      - path: .env
        required: true
    environment:
      <<: *admin-panel-urls
    # порт наружу не пробрасываем — вебхуки мерчантов идут через caddy (путь /pay на $DOMAIN_NAME)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - public-network
      - backend-network
    <<: [*default-logging, *public-dns]

  admin-frontend:
    # Образ из GHCR собран с пустым VITE_API_BASE_URL (относительный /api/...,
    # один и тот же домен что у панели, что у API — см. workflow) и годится
    # для любого DOMAIN_NAME без пересборки. build.args ниже — только для
    # локального `docker compose build`.
    image: ${IMAGE_REGISTRY:-ghcr.io/trottling}/telegram-store-admin-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./admin_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_PANEL_BACKEND_URL:-https://${DOMAIN_NAME}}
    container_name: telegram-store-admin-frontend
    # порт наружу не пробрасываем — статику отдаёт caddy (путь / на $DOMAIN_NAME)
    restart: unless-stopped
    networks:
      - public-network
    depends_on:
      - admin-backend
    <<: *default-logging

  # TLS-терминатор: единственный сервис с портами наружу (80/443), автовыпуск
  # сертификатов Let's Encrypt по ACME HTTP-01/TLS-ALPN. Домен и почта — из
  # DOMAIN_NAME/ACME_EMAIL (см. .env); один хост на всё, панель/API/вебхуки
  # платежей/вебхуки Telegram/Grafana разведены по пути (/, /api, /pay, /bot,
  # /stats) прямо в Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: telegram-store-caddy
    env_file:
      - path: .env
        required: true
    environment:
      # Пусто по умолчанию — Caddyfile слушает {$DOMAIN_NAME} без явного
      # порта, что означает 443. Если 443 на хосте занят чем-то посторонним
      # (см. PUBLIC_PORT в .env.example), сюда попадает ":8443" и т.п., и
      # Caddyfile дописывает это и к адресу сайта, и к редиректу на /start.
      PUBLIC_PORT_SUFFIX: ${PUBLIC_PORT:+:${PUBLIC_PORT}}
    ports:
      - "80:80"
      - "${PUBLIC_PORT:-443}:${PUBLIC_PORT:-443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bot
      - admin-backend
      - payments-backend
      - admin-frontend
      - grafana
    restart: unless-stopped
    networks:
      - public-network
    <<: [*default-logging, *public-dns]

  db:
    image: postgres:18-alpine
    container_name: telegram-store-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    <<: *default-logging

  redis:
    image: redis:8-alpine
    container_name: telegram-store-redis
    # ACL-пользователь из REDIS_USERNAME/REDIS_PASSWORD, default отключён —
    # подключиться можно только этой парой, requirepass одного пароля недостаточно
    # (config.New() отдельно проверяет, что обе переменные не пустые и не
    # плейсхолдер из .env.example).
    command: [
      # По умолчанию notice — и тогда в лог попадает каждое сохранение RDB/AOF
      # фонового процесса. warning оставляет то, что реально стоит увидеть
      # (у Redis нет уровня "warn", только полное "warning").
      "redis-server", "--appendonly", "yes", "--loglevel", "warning",
      "--user", "default", "off",
      "--user", "${REDIS_USERNAME}", "on", ">${REDIS_PASSWORD}", "allcommands", "allkeys", "allchannels"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USERNAME}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network
    <<: *default-logging

  # Ежедневный pg_dump + опциональная выгрузка в S3 (rclone), см. backup/.
  # На public-network только ради исходящего трафика к S3-эндпоинту —
  # backend-network (internal: true) наружу не роутит.
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    # crond из dcron сам себя переводит в отдельную группу процессов (setpgid)
    # при старте — ядро отказывает в этом PID 1 контейнера на части хостов
    # ("setpgid: Operation not permitted", вечный restart-loop). init: true
    # подставляет перед CMD настоящий init (tini) как PID 1, crond после этого
    # получает нормальный PID 2 и спокойно себя переводит в группу.
    init: true
    container_name: telegram-store-backup
    env_file:
      - path: .env
        required: true
    environment:
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network
      - public-network
    <<: [*default-logging, *public-dns]

  # Метрики бота (см. BOT_METRICS_PORT) — сам себя тоже скрейпит, см.
  # monitoring/prometheus/prometheus.yml. Наружу не торчит — доступ только
  # через Grafana (datasource) или изнутри docker-сети.
  prometheus:
    image: prom/prometheus:v3
    container_name: telegram-store-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      # По умолчанию info — и тогда в лог попадает каждый scrape каждой цели
      # (bot/admin-backend/payments-backend/сам себя) раз в интервал. warn
      # оставляет то, что реально стоит увидеть.
      - "--log.level=warn"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend-network
    <<: *default-logging

  # Хранилище логов. -config.expand-env=true — чтобы ${LOKI_RETENTION_DAYS} в
  # смонтированном конфиге подставился самим Loki, а не docker-compose (тот
  # ${VAR}-синтаксис на файлы внутри контейнеров не распространяется).
  loki:
    image: grafana/loki:3.7.6
    container_name: telegram-store-loki
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-14}
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - backend-network
    <<: *default-logging

  # Пересылает логи всех контейнеров в Loki — находит их сам через Docker
  # socket (docker_sd_configs), ни один существующий сервис трогать не нужно.
  # ro-монт /var/lib/docker/containers — там json-file уже пишет NDJSON
  # каждого контейнера (см. x-logging выше).
  promtail:
    image: grafana/promtail:3.6.11
    container_name: telegram-store-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - backend-network
    <<: *default-logging

  # Единственный публичный вход во весь observability-стек ($DOMAIN_NAME/stats
  # в Caddyfile, саб-путь — см. GF_SERVER_SERVE_FROM_SUB_PATH). Логин не свой —
  # auth.proxy доверяет X-WEBAUTH-USER, который проставляет admin-backend через
  # forward_auth в Caddy (тот же код из /admin, что и в веб-панель).
  # GRAFANA_ADMIN_USER/PASSWORD — только break-glass, доступны исключительно
  # изнутри docker-сети, публично эта форма входа не показывается.
  grafana:
    image: grafana/grafana:13.1
    container_name: telegram-store-grafana
    env_file:
      - path: .env
        required: true
    environment:
      # По умолчанию info — и тогда в лог попадает вообще любой рутинный запрос
      # (datasource healthcheck, session cleanup и т.п.) на уровне HTTP-сервера
      # Grafana. warn оставляет то, что реально стоит увидеть.
      GF_LOG_LEVEL: warn
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Grafana сама объявляет свои роуты под /stats/ и ожидает, что Caddy
      # проксирует путь как есть, не срезая префикс — см. Caddyfile.
      GF_SERVER_ROOT_URL: https://${DOMAIN_NAME}${PUBLIC_PORT:+:${PUBLIC_PORT}}/stats/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    # оба network: backend — достать prometheus/loki, public — чтобы caddy
    # нашёл её по имени (тот же паттерн, что у admin-backend).
    networks:
      - backend-network
      - public-network
    <<: *default-logging

networks:
  # db+redis видны только bot/admin-backend/payments-backend/migrate/backup/
  # prometheus/loki/promtail/grafana, без выхода наружу
  backend-network:
    driver: bridge
    internal: true
  # нужна для исходящих к Telegram (bot), к S3 (backup) и для caddy/admin-backend/
  # payments-backend/admin-frontend/grafana, между которыми ходят проксируемые запросы.
  # Подсеть закреплена, потому что admin-backend доверяет X-Forwarded-For только
  # от неё (ADMIN_PANEL_TRUSTED_PROXIES) — на плавающем адресе из дефолтного
  # пула Docker это доверие пришлось бы выдавать вслепую.
  public-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backup_data:
  prometheus_data:
  loki_data:
  grafana_data:
