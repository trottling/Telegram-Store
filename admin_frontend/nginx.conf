server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # По умолчанию notice (см. базовый nginx.conf образа). warn
    # (ADMIN_FRONTEND_LOG_LEVEL) оставляет то, что реально стоит увидеть.
    # ${ADMIN_FRONTEND_LOG_LEVEL} подставляет сам entrypoint образа nginx:alpine
    # (envsubst по шаблонам /etc/nginx/templates/*.template, см. Dockerfile) —
    # безопасно для $uri ниже: substitution-лист собирается из реальных
    # переменных окружения контейнера, а такой переменной там нет.
    error_log /dev/stderr ${ADMIN_FRONTEND_LOG_LEVEL};

    # SPA fallback — any path that isn't a real static file goes to
    # index.html so React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
