# Кросс-origin дефолты (фронт на :3000, бэк на :8080 — не одно и то же
# происхождение, в отличие от прод-стека за caddy): config.New() валидирует
# эти три у каждого Go-бинарника независимо от того, читает ли их конкретно
# он, так что все четыре нуждаются в них, не только admin-backend.
# PAYMENTS_BACKEND_URL — не localhost: с точки зрения контейнера-получателя
# вебхука "localhost" — это он сам, колбэк никогда бы не пришёл.
x-debug-urls: &debug-urls
  ADMIN_PANEL_FRONTEND_URL: ${ADMIN_PANEL_FRONTEND_URL:-http://localhost:3000}
  ADMIN_PANEL_CORS_ORIGIN: ${ADMIN_PANEL_CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
  PAYMENTS_BACKEND_URL: ${PAYMENTS_BACKEND_URL:-http://payments-backend:8081}

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: telegram-store-migrate
    env_file:
      - path: .env
        required: true
    environment:
      <<: *debug-urls
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - debug-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: telegram-store-bot
    env_file:
      - path: .env
        required: true
    environment:
      <<: *debug-urls
    ports:
      - "${BOT_METRICS_PORT:-9100}:${BOT_METRICS_PORT:-9100}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - debug-network

  admin-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin_backend
    container_name: telegram-store-admin-backend
    env_file:
      - path: .env
        required: true
    environment:
      <<: *debug-urls
    ports:
      - "${ADMIN_PANEL_BACKEND_PORT:-8080}:${ADMIN_PANEL_BACKEND_PORT:-8080}"
      - "${ADMIN_METRICS_PORT:-9101}:${ADMIN_METRICS_PORT:-9101}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - debug-network

  payments-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: payments_backend
    container_name: telegram-store-payments-backend
    env_file:
      - path: .env
        required: true
    environment:
      <<: *debug-urls
    ports:
      - "${PAYMENTS_BACKEND_PORT:-8081}:${PAYMENTS_BACKEND_PORT:-8081}"
      - "${PAYMENTS_METRICS_PORT:-9102}:${PAYMENTS_METRICS_PORT:-9102}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - debug-network

  # Тут, в отличие от docker-compose.yml, нет основного caddy, который мог бы
  # отдать статику сам (фронт и бэк на разных портах, без домена/TLS) —
  # standalone-таргет поднимает свой маленький Caddy just для этого (см.
  # admin_frontend/Dockerfile и admin_frontend/Caddyfile).
  admin-frontend:
    build:
      context: ./admin_frontend
      dockerfile: Dockerfile
      target: standalone
      args:
        VITE_API_BASE_URL: ${ADMIN_PANEL_BACKEND_URL:-http://localhost:8080}
    container_name: telegram-store-admin-frontend
    environment:
      ADMIN_FRONTEND_LOG_LEVEL: ${ADMIN_FRONTEND_LOG_LEVEL:-warn}
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - debug-network
    depends_on:
      - admin-backend

  db:
    image: postgres:18-alpine
    container_name: telegram-store-db
    command: ["postgres", "-c", "log_min_messages=${POSTGRES_LOG_LEVEL:-warning}"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - debug-network

  redis:
    image: redis:8-alpine
    container_name: telegram-store-redis
    ports:
      - "6379:6379"
    command: [
      "redis-server", "--appendonly", "yes", "--loglevel", "${REDIS_LOG_LEVEL:-warning}",
      "--user", "default", "off",
      "--user", "${REDIS_USERNAME}", "on", ">${REDIS_PASSWORD}", "allcommands", "allkeys", "allchannels"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USERNAME}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - debug-network

  # Наблюдаемость — тот же monitoring/, что и в docker-compose.yml, но без
  # forward_auth (тут нет caddy перед Grafana): вход обычной формой Grafana
  # по GRAFANA_ADMIN_USER/PASSWORD напрямую, не кодом из /admin.
  prometheus:
    image: prom/prometheus:v3
    container_name: telegram-store-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--log.level=${PROMETHEUS_LOG_LEVEL:-warn}"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - debug-network

  loki:
    image: grafana/loki:3.7.6
    container_name: telegram-store-loki
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-14}
      LOKI_LOG_LEVEL: ${LOKI_LOG_LEVEL:-warn}
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - debug-network

  promtail:
    image: grafana/promtail:3.6.11
    container_name: telegram-store-promtail
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      PROMTAIL_LOG_LEVEL: ${PROMTAIL_LOG_LEVEL:-warn}
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - debug-network

  grafana:
    image: grafana/grafana:13.1
    container_name: telegram-store-grafana
    env_file:
      - path: .env
        required: true
    environment:
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-warn}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - debug-network

networks:
  debug-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
