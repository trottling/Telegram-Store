services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: telegram-store-migrate
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - debug-network

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: telegram-store-bot
    env_file:
      - path: .env
        required: true
    ports:
      - "${BOT_METRICS_PORT:-9100}:${BOT_METRICS_PORT:-9100}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - debug-network

  admin_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin_backend
    container_name: telegram-store-admin-backend
    env_file:
      - path: .env
        required: true
    ports:
      - "${ADMIN_PANEL_BACKEND_PORT:-8080}:${ADMIN_PANEL_BACKEND_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - debug-network

  payments_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: payments_backend
    container_name: telegram-store-payments-backend
    env_file:
      - path: .env
        required: true
    ports:
      - "${PAYMENTS_BACKEND_PORT:-8081}:${PAYMENTS_BACKEND_PORT:-8081}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - debug-network

  admin_frontend:
    build:
      context: ./admin_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${ADMIN_PANEL_BACKEND_URL:-http://localhost:8080}
    container_name: telegram-store-admin-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - debug-network
    depends_on:
      - admin_backend

  db:
    image: postgres:latest
    container_name: telegram-store-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - debug-network

  redis:
    image: redis:latest
    container_name: telegram-store-redis
    ports:
      - "6379:6379"
    command: [
      "redis-server", "--appendonly", "yes",
      "--user", "default", "off",
      "--user", "${REDIS_USERNAME}", "on", ">${REDIS_PASSWORD}", "allcommands", "allkeys", "allchannels"
    ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--user", "${REDIS_USERNAME}", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - debug-network

  # Наблюдаемость — тот же monitoring/, что и в docker-compose.yml, но без
  # forward_auth (тут нет caddy перед Grafana): вход обычной формой Grafana
  # по GRAFANA_ADMIN_USER/PASSWORD напрямую, не кодом из /admin.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: telegram-store-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - debug-network

  loki:
    image: grafana/loki:3.2.0
    container_name: telegram-store-loki
    command: ["-config.file=/etc/loki/local-config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_DAYS: ${LOKI_RETENTION_DAYS:-14}
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - debug-network

  promtail:
    image: grafana/promtail:3.2.0
    container_name: telegram-store-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - debug-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: telegram-store-grafana
    env_file:
      - path: .env
        required: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    networks:
      - debug-network

networks:
  debug-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:
