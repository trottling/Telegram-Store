# docker_sd_configs сам находит все контейнеры через Docker socket — ни один
# существующий сервис не нужно трогать, чтобы его логи попали в Loki (все они
# и так пишут через json-file, см. x-logging в docker-compose.yml).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  # По умолчанию info — и тогда в лог попадает каждый цикл переоткрытия
  # позиций/переопроса Docker-контейнеров. warn оставляет то, что реально
  # стоит увидеть, не влияя на пересылку логов остальных контейнеров — это
  # отдельный конвейер (см. loki-config.yml, тот же приём).
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # __meta_docker_container_name приходит с ведущим "/" (так Docker API
      # отдаёт имена) — обрезаем для читаемого лейбла container="bot", а не
      # container="/telegram-store-bot".
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
