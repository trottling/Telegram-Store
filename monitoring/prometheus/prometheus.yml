global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Порты должны совпадать с BOT_METRICS_PORT/ADMIN_METRICS_PORT/
  # PAYMENTS_METRICS_PORT из .env — ${VAR}-подстановка docker-compose на этот
  # файл не распространяется, менять руками в обоих местах (см. CLAUDE.md).
  - job_name: bot
    static_configs:
      - targets: ["bot:9100"]

  - job_name: admin-backend
    static_configs:
      - targets: ["admin-backend:9101"]

  - job_name: payments-backend
    static_configs:
      - targets: ["payments-backend:9102"]
