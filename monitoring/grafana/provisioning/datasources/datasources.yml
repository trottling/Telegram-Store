# Авто-провижининг датасорсов — после первого деплоя оба уже настроены,
# ничего не нужно тыкать руками в UI. uid зафиксирован явно (иначе Grafana
# сгенерировала бы свой на каждый инстанс) — на него ссылаются панели в
# monitoring/grafana/provisioning/dashboards/bot-overview.json.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
