# Авто-провижининг датасорсов — после первого деплоя оба уже настроены,
# ничего не нужно тыкать руками в UI.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
