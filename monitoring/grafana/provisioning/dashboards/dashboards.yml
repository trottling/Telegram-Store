# Провижининг папки дашбордов — сами JSON-файлы дашбордов кладутся рядом,
# в эту же директорию: technical-overview.json (эксплуатация — updates/duration/
# panics/goroutines/логи) и business-overview.json (покупки/пополнения/рефералы/
# админ-действия/агрегаты из Postgres).
apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
