# Собирает и пушит все пять образов
# admin_frontend собирается с пустым VITE_API_BASE_URL: в проде фронт и API
# всегда на одном origin (см. Caddyfile), так что относительный путь ("/api/...")
# работает для любого домена — один и тот же образ годится для любого деплоя,
# без пересборки под конкретный DOMAIN_NAME.
name: Build and push images

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: migrate
            context: .
            dockerfile: Dockerfile
            target: migrate
            build-args: ""
          - name: bot
            context: .
            dockerfile: Dockerfile
            target: bot
            build-args: ""
          - name: admin-backend
            context: .
            dockerfile: Dockerfile
            target: admin_backend
            build-args: ""
          - name: payments-backend
            context: .
            dockerfile: Dockerfile
            target: payments_backend
            build-args: ""
          - name: admin-frontend
            context: ./admin_frontend
            dockerfile: Dockerfile
            # dist-export — та же статика, что и раньше, но без собственного
            # сервера: контейнер копирует dist/ в volume для основного caddy
            # (см. Caddyfile) и завершается. standalone-таргет (со своим Caddy)
            # используется только docker-compose.debug.yml и не публикуется.
            target: dist-export
            build-args: "VITE_API_BASE_URL="
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/telegram-store-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
